<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Patient Triage System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="flex justify-between items-center bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
            <div>
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid text-blue-500 fa-heart-pulse"></i> Smart Medical Triage Assistant
                </h1>
                <p class="text-xs text-slate-400 mt-1">Multi-Factor Vitals & Symptom Analysis Engine</p>
            </div>
            <span class="px-3 py-1 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs rounded-full font-mono flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live System Active
            </span>
        </header>

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-xs text-slate-400">Total Processed</p>
                <p id="statTotal" class="text-2xl font-bold text-white">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-red-500/30">
                <p class="text-xs text-red-400">Emergency Cases</p>
                <p id="statEmergency" class="text-2xl font-bold text-red-500">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-xs text-emerald-400">Normal / Routine</p>
                <p id="statNormal" class="text-2xl font-bold text-emerald-400">0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Patient Intake Form -->
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl lg:col-span-1 space-y-4">
                <h2 class="text-lg font-semibold text-white border-b border-slate-700 pb-2">Patient Intake & Vitals</h2>
                
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-300 font-medium">Patient Name</label>
                        <input id="name" type="text" placeholder="e.g. Rahul Sharma" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 mt-1">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-slate-300 font-medium">Age</label>
                            <input id="age" type="number" placeholder="45" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 mt-1">
                        </div>
                        <div>
                            <label class="text-xs text-slate-300 font-medium">Heart Rate (BPM)</label>
                            <input id="heart_rate" type="number" placeholder="75" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 mt-1">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-slate-300 font-medium">SpO2 (%)</label>
                            <input id="spo2" type="number" placeholder="98" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 mt-1">
                        </div>
                        <div>
                            <label class="text-xs text-slate-300 font-medium">Temp (°C)</label>
                            <input id="temp" type="number" step="0.1" placeholder="37.0" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 mt-1">
                        </div>
                    </div>

                    <div>
                        <label class="text-xs text-slate-300 font-medium">Symptom Description</label>
                        <textarea id="symptoms" rows="3" placeholder="Describe clinical symptoms..." class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 mt-1"></textarea>
                    </div>

                    <button onclick="submitTriage()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg transition text-sm shadow-lg shadow-blue-600/30">
                        Run Medical Assessment
                    </button>
                </div>
            </div>

            <!-- Doctor Dashboard -->
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl lg:col-span-2 space-y-4">
                <h2 class="text-lg font-semibold text-white border-b border-slate-700 pb-2">Priority Queue Dashboard</h2>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="text-slate-400 text-xs border-b border-slate-700">
                                <th class="pb-3">Patient</th>
                                <th class="pb-3">Vitals</th>
                                <th class="pb-3">Priority</th>
                                <th class="pb-3">Assessment Findings</th>
                                <th class="pb-3">Action Plan</th>
                            </tr>
                        </thead>
                        <tbody id="patientTable" class="divide-y divide-slate-700/50 text-xs"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadPatients() {
            const res = await fetch('/api/patients');
            const data = await res.json();
            
            document.getElementById('statTotal').innerText = data.length;
            document.getElementById('statEmergency').innerText = data.filter(p => p.risk_level === 'Emergency').length;
            document.getElementById('statNormal').innerText = data.filter(p => p.risk_level === 'Normal').length;

            const tbody = document.getElementById('patientTable');
            tbody.innerHTML = data.map(p => {
                let badgeClass = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                if (p.risk_level === 'Emergency') badgeClass = 'bg-red-500/10 text-red-400 border-red-500/30 font-bold';
                if (p.risk_level === 'Urgent') badgeClass = 'bg-amber-500/10 text-amber-400 border-amber-500/30';

                return `
                    <tr class="hover:bg-slate-700/30 transition">
                        <td class="py-3 pr-2">
                            <div class="font-semibold text-slate-200 text-sm">${p.name}</div>
                            <div class="text-slate-400 text-[10px]">Age: ${p.age}</div>
                        </td>
                        <td class="py-3 pr-2 text-slate-300">
                            <div>HR: ${p.heart_rate} bpm</div>
                            <div>SpO2: ${p.spo2}%</div>
                        </td>
                        <td class="py-3 pr-2">
                            <span class="px-2 py-1 border rounded-md text-[11px] ${badgeClass}">${p.risk_level}</span>
                            <div class="text-[10px] text-slate-400 mt-1">Score: ${p.score}</div>
                        </td>
                        <td class="py-3 pr-2 text-slate-300 max-w-[200px]">
                            <div class="font-medium text-slate-200">${p.reason}</div>
                            <div class="text-[10px] text-slate-400 truncate mt-0.5">"${p.symptoms}"</div>
                        </td>
                        <td class="py-3 text-slate-300">
                            <div class="font-medium text-slate-200">${p.action}</div>
                            <div class="text-[10px] text-blue-400 mt-0.5">ETA: ${p.eta}</div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function submitTriage() {
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const symptoms = document.getElementById('symptoms').value;
            const heart_rate = document.getElementById('heart_rate').value;
            const spo2 = document.getElementById('spo2').value;
            const temp = document.getElementById('temp').value;

            if (!name || !age || !symptoms) return alert('Please fill in required fields');

            await fetch('/api/patients', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, age, symptoms, heart_rate, spo2, temp })
            });

            document.getElementById('name').value = '';
            document.getElementById('age').value = '';
            document.getElementById('symptoms').value = '';
            document.getElementById('heart_rate').value = '';
            document.getElementById('spo2').value = '';
            document.getElementById('temp').value = '';
            loadPatients();
        }

        loadPatients();
    </script>
</body>
</html>
